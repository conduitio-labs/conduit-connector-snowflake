name: build

on:
  # Pushes made by GITHUB_TOKEN (dependabot auto-merge) do not trigger the
  # push event, so without a schedule main is never tested after a merge.
  schedule:
    - cron: '4 3 * * 1'
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Test
        env:
          connection: ${{ secrets.SNOWFLAKE_CONNECTION }}
          table: ${{ secrets.SNOWFLAKE_TABLE }}
          columns: ${{ secrets.SNOWFLAKE_COLUMNS }}
          key:  ${{ secrets.SNOWFLAKE_KEY }}
        run: make test GOTEST_FLAGS="-v -race -count=1"
